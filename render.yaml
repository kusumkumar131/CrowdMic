services:
  - type: web
    name: crowdmic-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: DATABASE_NAME
        value: crowdmic
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: STUN_SERVER
        value: stun:stun.l.google.com:19302
      - key: TURN_SERVER
        value: turn:openrelay.metered.ca:80
      - key: TURN_USERNAME
        value: openrelayproject
      - key: TURN_PASSWORD
        value: openrelayproject
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        value: https://crowd-mic.vercel.app
      - key: JWT_SECRET
        generateValue: true
